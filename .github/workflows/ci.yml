name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package.json
      - name: Install dependencies
        run: npm --prefix runtime ci
      - name: Run verification & tests
        run: |
          npm --prefix runtime test
          npm --prefix runtime run verify
